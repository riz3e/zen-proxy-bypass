name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# write: needed to create a GitHub release when a v* tag is pushed
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A v* tag must match manifest.json — the tag names the release and
      # the .xpi filename is derived from the manifest, so they can't drift.
      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(jq -r .version manifest.json)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest.json version $V — bump the version or fix the tag"
            exit 1
          fi

      # icon.svg is the source of truth: PNGs are regenerated, never trusted.
      - name: Regenerate icons from icon.svg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q librsvg2-bin
          for s in 48 96 128; do
            rsvg-convert -w $s -h $s icons/icon.svg -o icons/icon-$s.png
          done

      # Plain zip with explicit arcnames — inner paths must be preserved
      # (see AGENTS.md). Version lives only in manifest.json; the filename
      # follows it automatically, so it can never drift.
      - name: Pack .xpi
        run: |
          V=$(jq -r .version manifest.json)
          OUT="proxy-exclude-$V.xpi"
          zip -X "$OUT" \
            manifest.json common.js background.js \
            popup.html popup.js \
            options.html options.js \
            style.css \
            icons/icon-48.png icons/icon-96.png icons/icon-128.png
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: proxy-exclude-xpi
          path: proxy-exclude-*.xpi

      # Release only on tag pushes; regular commits to main stay artifact-only.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$OUT" \
            --title "proxy-exclude $GITHUB_REF_NAME" \
            --generate-notes
